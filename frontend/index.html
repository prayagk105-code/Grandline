<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Grandline — Daily Tracker & Life Operating System</title>
    <meta
      name="description"
      content="Personal performance, habit formation, study tracking, memory preservation, and life reflection ecosystem."
    />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Application Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="theme-color" content="#F3F2FA" media="(prefers-color-scheme: light)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
