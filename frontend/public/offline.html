<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Grandline — Offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg: #f8f6f0;
        --cd: #ffffff;
        --ink: #191c19;
        --mut: #6e776e;
        --ac: #23533c;
        --ac2: #e3ede6;
        --ln: #e5e1d5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121513;
          --cd: #1a201c;
          --ink: #f0f3ec;
          --mut: #96a196;
          --ac: #52b788;
          --ac2: #1e3125;
          --ln: #2b352d;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: var(--cd);
        border: 1px solid var(--ln);
        border-radius: 18px;
        padding: 32px 24px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      }
      .logo {
        width: 60px;
        height: 60px;
        background: var(--ac);
        color: #fff;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 30px;
        margin: 0 auto 16px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--mut);
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        background: var(--ac);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        border: none;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:active {
        opacity: 0.9;
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">⚓</div>
      <h1>You are offline</h1>
      <p>
        Grandline couldn't reach the network right now. Your previously cached data and views remain safe on your device.
      </p>
      <button class="btn" onclick="window.location.reload()">
        Retry Connection
      </button>
    </div>
  </body>
</html>
